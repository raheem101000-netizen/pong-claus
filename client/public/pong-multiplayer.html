<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PONG — Multiplayer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: none; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, 'Segoe UI', sans-serif; }
#gw { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
#game-shell { position: relative; width: 100%; max-width: 420px; }
#hud { display: flex; align-items: center; justify-content: center; padding: 10px 14px; background: rgba(0,0,0,0.95); border-radius: 8px 8px 0 0; overflow: hidden; }
#hud-wins  { font-size: 18px; font-weight: 700; color: #fff; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#canvas-wrap { border-radius: 0 0 8px 8px; overflow: hidden; }
canvas { display: block; background: #000; transform: translateZ(0); }
#overlay, #match-result, #waiting-screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.93); z-index: 10; border-radius: 8px; gap: 0;
}
#match-result, #waiting-screen { display: none; }
#lobby-title { font-size: 44px; letter-spacing: 14px; font-weight: 300; color: #fff; margin-bottom: 4px; }
#lobby-sub   { font-size: 11px; letter-spacing: 3px; color: #444; margin-bottom: 24px; }
#name-input  { background: transparent; border: 1px solid #333; color: #fff; padding: 11px 16px; font-family: monospace; font-size: 14px; width: 240px; border-radius: 4px; text-align: center; margin-bottom: 16px; letter-spacing: 1px; outline: none; }
#name-input:focus { border-color: #fff; }
.menu-row { display: flex; gap: 10px; margin-bottom: 10px; }
.btn { background: transparent; border: 1px solid #333; color: #666; padding: 10px 20px; font-family: monospace; font-size: 12px; cursor: pointer; letter-spacing: 2px; border-radius: 4px; transition: all 0.15s; }
.btn:active { transform: scale(0.96); }
.btn:hover  { border-color: #fff; color: #fff; }
.btn-green { background: #4CFF6C; color: #111; border: none; padding: 12px 32px; font-size: 14px; font-weight: 600; letter-spacing: 1px; border-radius: 4px; cursor: pointer; }
.btn-green:hover { background: #2ecc71; }
.btn-gold  { background: #FFD700; color: #111; border: none; padding: 12px 32px; font-size: 14px; font-weight: 600; letter-spacing: 1px; border-radius: 4px; cursor: pointer; }
#code-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
#code-input { background: transparent; border: 1px solid #333; color: #fff; padding: 10px 14px; font-family: monospace; font-size: 18px; font-weight: 700; width: 110px; border-radius: 4px; text-align: center; letter-spacing: 4px; outline: none; }
#code-input:focus { border-color: #fff; }
#room-code-display { font-size: 52px; font-weight: 700; font-family: monospace; color: #4CFF6C; letter-spacing: 8px; margin: 8px 0; }
#waiting-sub  { font-size: 12px; color: rgba(255,255,255,0.4); letter-spacing: 1px; margin-bottom: 20px; }
.spinner { width: 28px; height: 28px; border: 3px solid #222; border-top-color: #4CFF6C; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
#mr-change  { font-size: 44px; font-weight: 700; margin-bottom: 8px; }
#mr-score   { font-size: 32px; font-weight: 700; color: #fff; margin-bottom: 22px; letter-spacing: 1px; }
#powerup-banner { position: absolute; top: 46%; left: 50%; transform: translate(-50%,-50%); font-size: 13px; letter-spacing: 2px; color: #fff; pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 5; text-align: center; text-shadow: 0 0 10px currentColor; white-space: nowrap; }
#cd-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #fff; font-size: 64px; font-weight: 300; pointer-events: none; opacity: 0; z-index: 9; font-family: monospace; transition: opacity 0.15s; }
#conn-banner { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); z-index: 8; display: none; padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; letter-spacing: 1px; background: rgba(255,180,0,0.12); border: 1px solid rgba(255,180,0,0.4); color: #FFB400; white-space: nowrap; pointer-events: none; }
#error-msg { font-size: 11px; color: #FF4444; letter-spacing: 1px; margin-top: 6px; min-height: 16px; }
#role-label { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 10px; color: #222; letter-spacing: 2px; pointer-events: none; }
.tenten-back-btn{display:inline-block;margin-top:10px;font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:1px;color:rgba(255,255,255,0.6);text-decoration:none;border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:8px 18px;}
.tenten-back-btn:hover{color:#fff;border-color:rgba(255,255,255,0.5);}
</style>
</head>
<body>
<div id="gw">
  <div id="game-shell">
    <div id="hud">
      <div id="hud-wins">0 — 0</div>
    </div>
    <div id="canvas-wrap"><canvas id="canvas"></canvas></div>
    <div id="powerup-banner"></div>
    <div id="cd-msg"></div>
    <div id="conn-banner"></div>
    <div id="overlay">
      <div id="lobby-title">PONG</div>
      <div id="lobby-sub">MULTIPLAYER · FIRST TO 10</div>
      <div class="menu-row">
        <button class="btn-green" id="btn-create">Create Room</button>
      </div>
      <div id="code-row">
        <input id="code-input" type="text" maxlength="4" placeholder="CODE" autocomplete="off" />
        <button class="btn" id="btn-join">Join →</button>
      </div>
      <div id="error-msg"></div>
    </div>
    <div id="waiting-screen">
      <div style="font-size:12px;color:rgba(255,255,255,0.4);letter-spacing:2px;margin-bottom:12px;">ROOM CODE</div>
      <div id="room-code-display">----</div>
      <div id="waiting-sub">Share this code with your opponent</div>
      <div class="spinner"></div>
      <div style="font-size:11px;color:rgba(255,255,255,0.3);letter-spacing:1px;">Waiting for opponent to join...</div>
      <button class="btn" style="margin-top:20px;" id="btn-cancel">Cancel</button>
      <a id="tenten-back-wait" class="tenten-back-btn" href="https://tenten.run/">← TENTEN</a>
    </div>
    <div id="match-result">
      <div id="mr-change">YOU WIN!</div>
      <div id="mr-score">10 — 7</div>
      <div id="mr-credit" style="display:none;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:#4CFF6C;margin:4px 0 18px;text-align:center;"></div>
      <button class="btn-green" id="btn-rematch" style="display:none;margin-bottom:12px;background:#b450ff;color:#fff;">REMATCH</button>
      <button class="btn-green" id="btn-back-to-lobby">Back to Lobby</button>
      <a id="tenten-back-result" class="tenten-back-btn" href="https://tenten.run/">← TENTEN</a>
    </div>
    <div id="role-label"></div>
  </div>
</div>
<script src="/colyseus-adapter.js"></script>
<script>
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
const cdMsg   = document.getElementById('cd-msg');
let W, H, PADDLE_LONG, PADDLE_SHORT, BALL_R;
const S_W = 400, S_H = 660;
const S_PADDLE_LONG = Math.round(S_W * 0.28);   // 112, matches server
const PADDLE_SHORT_S = Math.round(S_H * 0.018);  // 12, server-unit paddle height
function resize() {
  W = Math.min(window.innerWidth, 420);
  H = Math.min(window.innerHeight - 80, 660);
  // Render at native device resolution (not upscaled) — backing store is
  // W*dpr x H*dpr device pixels, CSS box stays W x H so layout is unaffected.
  // All draw calls below keep using W/H logical coordinates; the transform
  // maps them onto the higher-res buffer.
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  PADDLE_LONG  = Math.round(W * 0.28);
  PADDLE_SHORT = Math.round(H * 0.018);
  BALL_R = Math.round(Math.min(W,H) * 0.018);
}
const browserId = (() => { let id = localStorage.getItem('pong_bid'); if (!id) { id = Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10); localStorage.setItem('pong_bid',id); } return id; })();
let socket, myRole, myName = '', oppName = '';
let currentRoomCode = null;
let gameState = null;
let gameRunning = false;
let keys = {};
const POWERUP_TYPES = {
  ice:    { emoji: '❄️',  color: '#00cfff' },
  fire:   { emoji: '🔥',  color: '#ff6600' },
  shrink: { emoji: '🔒',  color: '#cc44ff' },
  ghost:  { emoji: '👻',  color: '#aaffaa' },
};
const banner = document.getElementById('powerup-banner');
let bannerTimer = null, lastBannerSeq = 0;
function showPowerupBanner(text, color) {
  banner.textContent = text; banner.style.color = color; banner.style.opacity = '1';
  if (bannerTimer) clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => { banner.style.opacity = '0'; }, 1800);
}
// Your own paddle is drawn from your input straight away (client-side
// prediction) instead of waiting for the server to echo it back — that echo
// was a full network round trip behind every move. The server accepts this
// position as sent (it only clamps it, and ignores it while you're frozen), so
// prediction and server agree; draw() snaps back if they ever don't.
let localPaddleX = null;
let lastSentX    = null;
let lastInputAt  = 0;     // performance.now() of the last key/touch move
let lastHalfRtt  = 0;     // from the ping/pong below
function myEffect() { const e = gameState && gameState.activeEffects; return e ? (myRole === 'p1' ? e.p1 : e.p2) : null; }
function myPaddleLenS() { const e = myEffect(); return e && e.type === 'shrink' ? S_PADDLE_LONG * 0.45 : S_PADDLE_LONG; }
function myPaddleFrozen() { const e = myEffect(); return !!(e && e.type === 'frozen'); }
// ── Hit judgement on your own screen ────────────────────────────────────────
// Every paddle report tells the server which moment of the ball was ON SCREEN
// (shownTick: where the drawn ball sits between server ticks, as a fraction —
// it trails the newest update slightly because it's smoothed). The server
// settles a ball reaching your line from where your paddle was in the moment
// before the ball touched the line on your screen. This page keeps the same
// reports and runs the same rule as soon as that moment has been shown, so you
// see the true outcome at once — a return only if your paddle was really there.
const S_BALL_R = Math.round(Math.min(S_W, S_H) * 0.018);   // 7, matches server
const S_FORGIVE = Math.round(S_W * 0.05);                  // 20
let seenTick = 0, lastStateAt = 0, shownTick = 0;
let ballHist = [];                 // recent { tick, x, y } from the server
let myReports = [], myXBefore = null;
let pendingJudge = null, ballOverride = null;
function sendMyX() {
  if (!socket || !socket.connected || localPaddleX === null) return;
  const seen = Math.round(shownTick * 100) / 100;
  socket.emit('paddleMove', { x: localPaddleX, seen });
  lastSentX = localPaddleX;
  myReports.push({ seen, x: localPaddleX });
  if (myReports.length > 240) { myXBefore = myReports[myReports.length - 241].x; myReports.splice(0, myReports.length - 240); }
}
function coversX(px, len, x) { return x + S_BALL_R > px - S_FORGIVE && x - S_BALL_R < px + len + S_FORGIVE; }
// Same rule as the server's settleJudgement.
function myCall(j) {
  let carried = myXBefore;
  const during = [];
  for (const r of myReports) { if (r.seen < j.c - 1) carried = r.x; else if (r.seen < j.c) during.push(r.x); }
  if (carried === null) carried = myRole === 'p1' ? gameState.p1.x : gameState.p2.x;
  const len = myPaddleLenS();
  return [carried, ...during].find(x => coversX(x, len, j.x));
}
function settleMine() {
  const j = pendingJudge;
  if (!j || shownTick < j.c) return;
  pendingJudge = null;
  const viewX = myCall(j), hit = viewX !== undefined;
  if (hit === j.prov) return;                        // server's provisional call already right
  let vx = j.vx, vy = j.vy;
  if (hit) {
    const len = myPaddleLenS();
    const rel = Math.max(-1, Math.min(1, (j.x - (viewX + len / 2)) / (len / 2)));
    const spd = Math.hypot(j.vx, j.vy) + 0.3;   // matches the server: +0.3 per hit, no cap
    vx = Math.sin(rel * Math.PI / 4) * spd;
    vy = Math.cos(rel * Math.PI / 4) * spd * (myRole === 'p1' ? -1 : 1);
  }
  ballOverride = { s: j.s, x: j.x, y: j.y, vx, vy, made: performance.now() };
}
// Smoothly interpolated draw state — lerps toward server truth each frame
let drawn = { p1x: null, p2x: null, bx: null, by: null };
let lastFrameTs = null; // for delta-time-normalized smoothing in draw()
// Point-scored tracking (client-side, derived from score changes)
let lastP1Score = 0, lastP2Score = 0, scoredWho = null;
// "Reconnecting…" (our connection) / "opponent away" (theirs), above the board.
let meReconnecting = false, oppAway = false, matchOver = false;
function updateConnBanner() {
  const el = document.getElementById('conn-banner');
  const t = matchOver ? '' : meReconnecting ? 'Connection lost — reconnecting… your paddle is kept' : oppAway ? ((oppName || 'Your opponent') + ' is away — waiting for them…') : '';
  el.textContent = t; el.style.display = t ? 'block' : 'none';
}
function connect() {
  // The adapter sends the presence heartbeat ('hb' every 5 s) and handles
  // reconnecting: fast resume first, then a fresh connection that takes our
  // account's seat back (joinRoom on every 'connect' / 'resume', below).
  socket = io();
  setInterval(() => {
    if (socket && socket.connected) socket.emit('ping', { ts: Date.now() });
  }, 2000);
  socket.on('pong', function(data) {
    var halfRtt = Math.floor((Date.now() - data.ts) / 2);
    lastHalfRtt = halfRtt;
    socket.emit('latency', { ms: halfRtt });
  });
  socket.on('disconnect', (reason) => console.log('[CLIENT] disconnected:', reason));
  socket.on('match_gone', matchGone);
  socket.io.on('reconnect', (n) => console.log('[CLIENT] reconnected after', n, 'attempts'));
  socket.on('drop', () => { meReconnecting = true; updateConnBanner(); });
  socket.on('resume', () => {
    meReconnecting = false; updateConnBanner();
    socket.emit('joinRoom', { code: currentRoomCode || roomFromURL, name: myName, bid: browserId });
  });
  socket.on('presence', ({ p1Away, p2Away }) => { oppAway = myRole === 'p1' ? !!p2Away : !!p1Away; updateConnBanner(); });
  // Our seat was taken over by this account in another tab/device: stop here
  // (no frozen board). Back to Lobby from here takes it back.
  socket.on('superseded', ({ message }) => {
    gameRunning = false; gameState = null; matchOver = true; updateConnBanner();
    document.getElementById('mr-change').textContent = 'OPENED ELSEWHERE';
    document.getElementById('mr-change').style.color = '#FFB400';
    document.getElementById('mr-score').textContent = message || 'You opened this match somewhere else.';
    document.getElementById('mr-credit').style.display = 'none';
    document.getElementById('match-result').style.display = 'flex';
  });
  socket.on('connect_error', () => showError('Cannot connect to server'));
  socket.on('roomCreated', ({ code, role }) => {
    myRole = role;
    currentRoomCode = code;
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('waiting-screen').style.display = 'flex';
    document.getElementById('room-code-display').textContent = code;
    document.getElementById('role-label').textContent = 'YOU ARE PLAYER 1 — BOTTOM PADDLE';
  });
  socket.on('roomJoined', ({ code, role, myName: serverName, paddlePos, prize }) => {
    myRole = role;
    if (prize) matchPrize = prize;   // the prize both players agreed on in the lobby
    meReconnecting = false; updateConnBanner();
    if (code) currentRoomCode = code;
    if (serverName) myName = serverName;
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('waiting-screen').style.display = 'none';
    document.getElementById('role-label').textContent = myName + ' — ' + paddlePos + ' PADDLE';
    updateHUD(0, 0);
  });
  socket.on('opponentName', ({ name }) => {
    oppName = name;
    document.getElementById('role-label').textContent = myName + ' vs ' + name;
  });
  socket.on('countdown', ({ count }) => {
    if (count === 3) {
      localPaddleX = null; lastSentX = null; drawn = { p1x: null, p2x: null, bx: null, by: null }; lastP1Score = 0; lastP2Score = 0; scoredWho = null; lastBannerSeq = 0;
      updateHUD(0, 0);
      document.getElementById('match-result').style.display = 'none';
    }
    cdMsg.textContent = count; cdMsg.style.opacity = '1';
    setTimeout(() => { cdMsg.style.opacity = '0'; }, 800);
  });
  socket.on('state', (s) => {
    gameState = s; gameRunning = true;
    seenTick = s.tick || 0; lastStateAt = performance.now();
    ballHist.push({ tick: seenTick, x: s.ball.x, y: s.ball.y });
    if (ballHist.length > 40) ballHist.shift();
    if (s.judge) { if (!pendingJudge || pendingJudge.s !== s.judge.s) { if (!ballOverride || ballOverride.s !== s.judge.s) pendingJudge = s.judge; } }
    else { pendingJudge = null; ballOverride = null; }
    // While the ball is coming at us (or a call on our line is open), report
    // the paddle with the tick on screen even if it hasn't moved, so the
    // server can settle the call without waiting.
    const me = myRole === 'p1' ? s.p1 : s.p2;
    if (me && s.delay === 0) {
      const toward = myRole === 'p1' ? s.ball.vy > 0 : s.ball.vy < 0;
      const dist = Math.abs(s.ball.y - me.y);
      if (s.judge || (toward && dist < 140)) sendMyX();
    }
    if (s.p1.score !== lastP1Score) { scoredWho = 'p1'; lastP1Score = s.p1.score; }
    if (s.p2.score !== lastP2Score) { scoredWho = 'p2'; lastP2Score = s.p2.score; }
    const myScore  = myRole === 'p1' ? s.p1.score : s.p2.score;
    const oppScore = myRole === 'p1' ? s.p2.score : s.p1.score;
    updateHUD(myScore, oppScore);
    if (s.bannerSeq && s.bannerSeq !== lastBannerSeq) {
      lastBannerSeq = s.bannerSeq;
      showPowerupBanner(s.bannerText, s.bannerColor);
    }
  });
  socket.on('matchEnd', (data) => {
    matchOver = true; updateConnBanner();
    gameRunning = false; gameState = null; localPaddleX = null; lastSentX = null; drawn = { p1x: null, p2x: null, bx: null, by: null }; lastP1Score = 0; lastP2Score = 0; scoredWho = null;
    const iWon = (myRole==='p1'&&data.winner==='p1')||(myRole==='p2'&&data.winner==='p2');
    document.getElementById('mr-credit').style.display = 'none';
    showMatchResult(iWon, data);
    if (data.walkover) document.getElementById('mr-score').textContent = iWon ? 'Your opponent left the match' : 'You left the match';
    // We were away when the match was decided without us: say so plainly and
    // take us back to the lobby (not a frozen board).
    if (!iWon && data.walkover) {
      const opp = (myRole === 'p1' ? data.p2Name : data.p1Name) || oppName || 'Your opponent';
      document.getElementById('mr-change').textContent = 'MATCH OVER';
      document.getElementById('mr-score').textContent = 'You were away too long. ' + opp + ' won.';
      returnToLobbySoon();
    }
    if (iWon) {
      document.getElementById('mr-credit').textContent = matchPrize ? 'Adding your $' + matchPrize + ' prize…' : 'Adding your prize…';
      document.getElementById('mr-credit').style.display = 'block';
    }
  });
  // Auto-credit (replaces the old "$8 — claim by PayPal" form): the server
  // credits the winner's tenten.run balance and tells the winner.
  socket.on('pongmp:credit', (c) => {
    const el = document.getElementById('mr-credit');
    if (c && c.status === 'credited') { el.textContent = 'You won! $' + c.amount + ' added to your balance'; el.style.color = '#4CFF6C'; }
    else if (c && c.status === 'disabled') { el.textContent = "Cash prizes aren't live yet — no balance was credited for this win."; el.style.color = 'rgba(255,255,255,0.6)'; }
    else { el.textContent = "Your prize couldn't be added automatically — it's been logged and will be credited."; el.style.color = '#FFB400'; }
    el.style.display = 'block';
  });
  // Rematch: offered once the match is decided and paid. The first press
  // takes both players back to their room's chat, where the other accepts.
  socket.on('rematch:available', () => {
    if (lobbyReturnTimer) return;   // already on the way back to the lobby
    const b = document.getElementById('btn-rematch');
    b.style.display = 'inline-block'; b.disabled = false; b.textContent = 'REMATCH';
  });
  socket.on('rematch:go', () => {
    const b = document.getElementById('btn-rematch');
    b.disabled = true; b.textContent = 'Back to the room…';
    setTimeout(() => { if (socket) socket.disconnect(); window.location.href = backToLobbyURL(); }, 400);
  });
  socket.on('rematch:error', ({ message }) => {
    const b = document.getElementById('btn-rematch');
    b.style.display = 'none';
    const el = document.getElementById('mr-credit');
    el.textContent = message || 'Rematch not possible right now'; el.style.color = '#FFB400'; el.style.display = 'block';
  });
  socket.on('opponentLeft', () => {
    gameRunning = false; matchOver = true; updateConnBanner();
    showError('Opponent left the game');
    setTimeout(() => {
      if (socket) socket.disconnect();
      window.location.href = backToLobbyURL();
    }, 2500);
  });
  socket.on('error', ({ msg }) => showError(msg));
}
// After a match that ended without us: count down, then the lobby.
let lobbyReturnTimer = null;
let matchPrize = null;   // e.g. "10.00" — set by the server on join
function returnToLobbySoon(seconds) {
  if (lobbyReturnTimer) return;
  let n = seconds || 6;
  const el = document.getElementById('mr-credit');
  const tick = () => {
    el.textContent = 'Back to the lobby in ' + n + '…';
    el.style.color = 'rgba(255,255,255,0.55)';
    el.style.display = 'block';
    if (n-- <= 0) { clearInterval(lobbyReturnTimer); if (socket) socket.disconnect(); window.location.href = backToLobbyURL(); }
  };
  tick();
  lobbyReturnTimer = setInterval(tick, 1000);
}
// The match room is gone (it closes once both players have left): the match
// ended while we were away.
function matchGone() {
  gameRunning = false; gameState = null; matchOver = true; updateConnBanner();
  document.getElementById('mr-change').textContent = 'MATCH OVER';
  document.getElementById('mr-change').style.color = '#FF4444';
  document.getElementById('mr-score').textContent = 'You were away too long — the match ended without you.';
  document.getElementById('match-result').style.display = 'flex';
  returnToLobbySoon();
}
function backToLobbyURL() {
  return '/rooms.html?name=' + encodeURIComponent(myName);
}
function updateHUD(myScore, oppScore) {
  const left  = myName || 'You';
  const right = oppName || 'Opponent';
  document.getElementById('hud-wins').textContent = `${left}  ${myScore} — ${oppScore}  ${right}`;
}
function draw(ts) {
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  if (!gameState) { requestAnimationFrame(draw); return; }
  const s = gameState;
  ctx.strokeStyle='#111'; ctx.lineWidth=1; ctx.setLineDash([6,8]);
  ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke(); ctx.setLineDash([]);
  // Initialise drawn state on first frame of a new match.
  if (drawn.p1x === null) { drawn.p1x = s.p1.x; drawn.p2x = s.p2.x; drawn.bx = s.ball.x; drawn.by = s.ball.y; }
  // Lerp all drawn positions toward server truth every frame — smooth without lying.
  // L=0.65 was tuned assuming ~60fps (16.667ms) frames; converting it to an
  // exponential-decay rate and reapplying per elapsed ms keeps the SAME
  // convergence speed in wall-clock time regardless of the display's actual
  // refresh rate (60Hz, 90Hz, 120Hz, or a janky/variable one).
  const now = ts || performance.now();
  const dt = lastFrameTs != null ? (now - lastFrameTs) : (1000 / 60);
  lastFrameTs = now;
  const L = 0.65;
  const alpha = 1 - Math.pow(1 - L, dt / (1000 / 60));
  drawn.p1x += (s.p1.x - drawn.p1x) * alpha;
  drawn.p2x += (s.p2.x - drawn.p2x) * alpha;
  const ballJump = Math.hypot(s.ball.x - drawn.bx, s.ball.y - drawn.by);
  if (ballJump > 100) { drawn.bx = s.ball.x; drawn.by = s.ball.y; }
  else { drawn.bx += (s.ball.x - drawn.bx) * alpha; drawn.by += (s.ball.y - drawn.by) * alpha; }
  // Which moment the drawn ball is showing: its position between two recent
  // server ticks, as a fractional tick.
  if (!ballOverride) {
    let best = null, bestD = Infinity;
    for (let i = ballHist.length - 2; i >= 0; i--) {
      const a = ballHist[i], b2 = ballHist[i + 1];
      const dx = b2.x - a.x, dy = b2.y - a.y, L2 = dx * dx + dy * dy;
      const t = L2 > 0 ? Math.max(0, Math.min(1, ((drawn.bx - a.x) * dx + (drawn.by - a.y) * dy) / L2)) : 1;
      const d = Math.hypot(a.x + dx * t - drawn.bx, a.y + dy * t - drawn.by);
      if (d < bestD - 0.01) { bestD = d; best = a.tick + t * (b2.tick - a.tick); }
    }
    if (best !== null && best > shownTick) shownTick = best;
  } else if (seenTick > shownTick) shownTick = seenTick;
  settleMine();
  // Our own call on a ball at our line differs from the server's provisional
  // one: show our (correct) outcome until the server settles it the same way.
  if (ballOverride && performance.now() - ballOverride.made < 600) {
    const o = ballOverride;
    const k = Math.min(30, (performance.now() - o.made) / (1000 / 60));
    let bx = o.x + o.vx * k; const by = o.y + o.vy * k;
    if (bx - S_BALL_R < 0) bx = 2 * S_BALL_R - bx;
    if (bx + S_BALL_R > S_W) bx = 2 * (S_W - S_BALL_R) - bx;
    drawn.bx = bx; drawn.by = by;
  }

  const flip = myRole === 'p2';
  const flipY   = (sy) => flip ? (S_H - sy - PADDLE_SHORT_S) : sy;
  const mirrorX = (sx, len) => flip ? (S_W - sx - len) : sx;
  const serverMyX = myRole === 'p1' ? s.p1.x : s.p2.x;
  // Reconcile: if the server's position for us still differs once our last
  // move has had time to reach it and come back (it ignored a move while we
  // were frozen, say), take the server's.
  if (localPaddleX !== null && Math.abs(serverMyX - localPaddleX) > 1 &&
      performance.now() - lastInputAt > Math.max(400, 4 * lastHalfRtt + 100)) {
    localPaddleX = serverMyX; lastSentX = serverMyX;
  }
  const myDrawnX  = (localPaddleX !== null && gameRunning) ? localPaddleX : (myRole === 'p1' ? drawn.p1x : drawn.p2x);
  const oppDrawnX = myRole === 'p1' ? drawn.p2x : drawn.p1x;
  const myServerY  = myRole === 'p1' ? s.p1.y : s.p2.y;
  const oppServerY = myRole === 'p1' ? s.p2.y : s.p1.y;

  const effects = s.activeEffects || {};

  // Obstacles
  for (const o of (s.obstacles || [])) {
    const alpha = Math.min(1, o.life/60) * 0.85;
    const pulse = Math.sin(Date.now()/200)*0.15+0.7;
    const osx = flip ? (S_W - o.x - o.w) : o.x;
    const osy = flip ? (S_H - o.y - o.h) : o.y;
    ctx.fillStyle = `rgba(255,80,80,${alpha*pulse})`;
    ctx.shadowColor = 'rgba(255,60,60,0.6)'; ctx.shadowBlur = 8;
    ctx.fillRect(osx*(W/S_W), osy*(H/S_H), o.w*(W/S_W), o.h*(H/S_H));
    ctx.shadowBlur = 0;
  }

  // Power-up
  if (s.powerup) {
    const def = POWERUP_TYPES[s.powerup.type] || { emoji: '?', color: '#fff' };
    const pulse = 0.75 + Math.sin(s.powerup.pulse*0.12)*0.25;
    const r = Math.round(Math.min(W,H)*0.042) * pulse;
    const px = (flip ? (S_W - s.powerup.x) : s.powerup.x) * (W/S_W);
    const py = (flip ? (S_H - s.powerup.y) : s.powerup.y) * (H/S_H);
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2);
    ctx.fillStyle = def.color+'33'; ctx.fill();
    ctx.strokeStyle = def.color; ctx.lineWidth = 2; ctx.stroke();
    ctx.font = `${Math.round(r*1.2)}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
    ctx.fillText(def.emoji, px, py); ctx.textBaseline = 'alphabetic';
  }

  // Ball (effect-tinted)
  const ballEff  = effects.ball;
  const isFire   = ballEff && ballEff.type === 'fire';
  const isIce    = ballEff && ballEff.type === 'ice';
  const isGhost  = ballEff && ballEff.type === 'ghost';
  ctx.beginPath();
  const ballSX = flip ? (S_W - drawn.bx) : drawn.bx;
  const ballSY = flip ? (S_H - drawn.by) : drawn.by;
  ctx.arc(ballSX*(W/S_W), ballSY*(H/S_H), BALL_R, 0, Math.PI*2);
  if (isFire)       { ctx.fillStyle='#ff6600'; ctx.shadowColor='#ff4400'; ctx.shadowBlur=14; }
  else if (isIce)   { ctx.fillStyle='#00cfff'; ctx.shadowColor='#00aaff'; ctx.shadowBlur=12; }
  else if (isGhost) { ctx.fillStyle='rgba(180,255,180,0.45)'; ctx.shadowBlur=0; }
  else              { ctx.fillStyle='#fff'; ctx.shadowBlur=0; }
  ctx.fill(); ctx.shadowBlur=0;

  // Paddles (dynamic length for shrink, glow for frozen)
  const myEff  = myRole === 'p1' ? effects.p1 : effects.p2;
  const oppEff = myRole === 'p1' ? effects.p2 : effects.p1;
  const myShrunk = myEff && myEff.type === 'shrink', oppShrunk = oppEff && oppEff.type === 'shrink';
  const myFrozen = myEff && myEff.type === 'frozen', oppFrozen = oppEff && oppEff.type === 'frozen';
  const myLenS  = myShrunk  ? S_PADDLE_LONG*0.45 : S_PADDLE_LONG;
  const oppLenS = oppShrunk ? S_PADDLE_LONG*0.45 : S_PADDLE_LONG;
  const myLenC  = myShrunk  ? PADDLE_LONG*0.45 : PADDLE_LONG;
  const oppLenC = oppShrunk ? PADDLE_LONG*0.45 : PADDLE_LONG;

  const myX  = mirrorX(myDrawnX, myLenS)   * (W/S_W);
  const oppX = mirrorX(oppDrawnX, oppLenS) * (W/S_W);
  const myY  = flipY(myServerY)   * (H/S_H);
  const oppY = flipY(oppServerY)  * (H/S_H);
  ctx.shadowBlur = myFrozen?10:0; ctx.shadowColor = myFrozen?'#00cfff':'transparent';
  ctx.fillStyle = myFrozen?'#00cfff':'#4CFF6C';
  ctx.fillRect(myX, myY, myLenC, PADDLE_SHORT); ctx.shadowBlur=0;
  ctx.shadowBlur = oppFrozen?10:0; ctx.shadowColor = oppFrozen?'#00cfff':'transparent';
  ctx.fillStyle = oppFrozen?'#00cfff':'#fff';
  ctx.fillRect(oppX, oppY, oppLenC, PADDLE_SHORT); ctx.shadowBlur=0;
  const fs=Math.round(Math.min(W,H)*0.1);
  ctx.font=`${fs}px monospace`; ctx.textAlign='center'; ctx.fillStyle='#1a1a1a';
  ctx.fillText(s.p2.score, W/2, H/2-fs*0.15);
  ctx.fillText(s.p1.score, W/2, H/2+fs);
  const is=Math.round(Math.min(W,H)*0.026);
  ctx.font=`${is}px serif`; ctx.textAlign='center';
  if (effects.p1) { const d=POWERUP_TYPES[effects.p1.type]||{}; ctx.fillText(d.emoji||'', W/2+fs*0.55, H/2+fs*1.3); }
  if (effects.p2) { const d=POWERUP_TYPES[effects.p2.type]||{}; ctx.fillText(d.emoji||'', W/2+fs*0.55, H/2-fs*0.45); }
  if (s.delay > 0) {
    const count = Math.ceil(s.delay / 30);
    if (count > 0 && count <= 3) {
      const cs = Math.round(Math.min(W,H) * 0.075);
      ctx.font = `${cs}px monospace`; ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillText(count, W/2, H/2 + cs * 0.35);
    }
    // Blank pause window (delay > 90 = first 2 s after a point) — show who scored.
    if (count > 3 && scoredWho !== null) {
      const iScored = scoredWho === myRole;
      const ps = Math.round(Math.min(W,H) * 0.065);
      ctx.font = `bold ${ps}px monospace`; ctx.textAlign = 'center';
      ctx.fillStyle = iScored ? '#4CFF6C' : '#FF4444';
      ctx.fillText(iScored ? 'POINT!' : 'POINT', W/2, H/2 - Math.round(H * 0.1));
    }
  }
  requestAnimationFrame(draw);
}
function showMatchResult(iWon, data) {
  const chEl = document.getElementById('mr-change');
  chEl.textContent = iWon ? 'YOU WIN!' : 'YOU LOSE!';
  chEl.style.color  = iWon ? '#4CFF6C' : '#FF4444';

  const p1s = myRole==='p1' ? data.p1Score : data.p2Score;
  const p2s = myRole==='p1' ? data.p2Score : data.p1Score;
  document.getElementById('mr-score').textContent = `${p1s} — ${p2s}`;
  document.getElementById('match-result').style.display = 'flex';
}
function showError(msg) { document.getElementById('error-msg').textContent=msg; setTimeout(()=>{ document.getElementById('error-msg').textContent=''; },3000); }
document.addEventListener('keydown', e=>{ keys[e.key]=true; if(['ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault(); });
document.addEventListener('keyup', e=>{ keys[e.key]=false; });
function applyTouch(e) {
  e.preventDefault();
  if (e.touches.length === 0) return;
  const rect = canvas.getBoundingClientRect();
  const t = e.touches[0];
  if (myPaddleFrozen()) return;
  let serverX = ((t.clientX - rect.left) / rect.width) * S_W;
  if (myRole === 'p2') serverX = S_W - serverX;
  const len = myPaddleLenS();
  localPaddleX = Math.max(0, Math.min(S_W - len, serverX - len / 2));
  lastInputAt = performance.now();
  if (gameRunning) sendMyX();
}
canvas.addEventListener('touchstart', applyTouch, { passive: false });
canvas.addEventListener('touchmove',  applyTouch, { passive: false });
canvas.addEventListener('touchend',   e => { e.preventDefault(); }, { passive: false });
document.getElementById('btn-create').onclick=()=>{ myName=document.getElementById('name-input').value.trim()||'Player 1'; connect(); socket.on('connect',()=>socket.emit('createRoom',{name:myName})); };
document.getElementById('btn-join').onclick=()=>{ const code=document.getElementById('code-input').value.trim(); if(code.length!==4){showError('Enter a 4-digit code');return;} myName=document.getElementById('name-input').value.trim()||'Player 2'; connect(); socket.on('connect',()=>socket.emit('joinRoom',{code,name:myName})); };
document.getElementById('btn-cancel').onclick=()=>{ if(socket)socket.disconnect(); document.getElementById('waiting-screen').style.display='none'; document.getElementById('overlay').style.display='flex'; };
document.getElementById('btn-rematch').onclick=()=>{
  const b = document.getElementById('btn-rematch');
  if (b.disabled || !socket) return;
  b.disabled = true; b.textContent = 'Asking for a rematch…';
  socket.emit('rematch');
};
document.getElementById('btn-back-to-lobby').onclick=()=>{
  if (socket) socket.disconnect();
  window.location.href = backToLobbyURL();
};
// Keyboard: moves the (predicted) paddle every frame and sends it to the
// server as fast as possible — unthrottled, deduplicated by position. Speed is
// per elapsed time, so it's the same on 60 Hz, 120 Hz or a slow phone.
let lastLoopTs = null;
function paddleLoop(ts) {
  const now = ts || performance.now();
  const dt = lastLoopTs != null ? Math.min(50, now - lastLoopTs) : 1000 / 60;
  lastLoopTs = now;
  if (gameRunning) {
    if (localPaddleX === null) {
      localPaddleX = (myRole === 'p1'
        ? (gameState?.p1?.x ?? S_W/2 - S_PADDLE_LONG/2)
        : (gameState?.p2?.x ?? S_W/2 - S_PADDLE_LONG/2));
    }
    const pspd = S_W * 0.032 * (dt / (1000 / 60));
    let left  = keys['ArrowLeft']  || keys['a'] || keys['A'];
    let right = keys['ArrowRight'] || keys['d'] || keys['D'];
    if (myRole === 'p2') { const tmp = left; left = right; right = tmp; }
    if (!myPaddleFrozen()) {
      if (left)  { localPaddleX -= pspd; lastInputAt = performance.now(); }
      if (right) { localPaddleX += pspd; lastInputAt = performance.now(); }
    }
    localPaddleX = Math.max(0, Math.min(S_W - myPaddleLenS(), localPaddleX));
    if (lastSentX === null || Math.abs(localPaddleX - lastSentX) > 0.5) sendMyX();
  }
  requestAnimationFrame(paddleLoop);
}
paddleLoop();
window.addEventListener('resize', resize);
resize(); updateHUD(0,0); draw();

// Auto-join from rooms lobby
const urlParams = new URLSearchParams(window.location.search);
const roomFromURL = urlParams.get('room');
const pongAuth = window.pongmpAuth();
// Matches start from the lobby, logged in: no login or no room → lobby (login gate there).
if (!pongAuth || !roomFromURL) location.replace('/rooms.html');
if (roomFromURL && pongAuth) {
  myName = pongAuth.name || 'Player';
  document.getElementById('overlay').style.display = 'none';
  connect();
  // Every new connection (first load, reload, bfcache, or after a resume
  // wasn't possible) asks for our account's seat: the server hands it over.
  socket.on('connect', () => {
    meReconnecting = false; updateConnBanner();
    socket.emit('joinRoom', { code: currentRoomCode || roomFromURL, name: myName, bid: browserId });
  });
}
</script>
